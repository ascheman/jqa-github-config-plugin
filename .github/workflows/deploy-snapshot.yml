name: Deploy Snapshot

on:
  push:
    branches: [ main ]
  workflow_dispatch: { }

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-snapshot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          # Writes ~/.m2/settings.xml with a <server> block for the repository
          # id `github` used by the `github` profile in pom.xml. The default
          # env-var names (GITHUB_ACTOR / GITHUB_TOKEN) are auto-provided by
          # GitHub Actions, so no extra secrets are needed.
          server-id: github

      - name: Deploy snapshot to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress clean deploy
